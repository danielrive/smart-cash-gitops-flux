apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: payment-service
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "services/payment-service/overlays/develop"
  prune: true
  images:
  - name: service-image
    newName: 658299583140.dkr.ecr.us-west-2.amazonaws.com/payment-service-smart-cash # {"$imagepolicy": "develop:img-upd-payment:name"}
    newTag: develop-1769989580 # {"$imagepolicy": "develop:payment:tag"}
  postBuild:
    substitute:
      APP_VERSION: "develop-1769989580" # {"$imagepolicy": "develop:payment:tag"}
