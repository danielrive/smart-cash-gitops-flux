apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: payment-orchestrator-service
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "services/payment-orchestrator-service/overlays/develop"
  prune: true
  images:
  - name: service-image
    newName: 658299583140.dkr.ecr.us-west-2.amazonaws.com/payment-orchestrator-service-smart-cash # {"$imagepolicy": "develop:img-upd-payment-orchestrator:name"}
    newTag: develop-1770176789 # {"$imagepolicy": "develop:payment-orchestrator:tag"}
  postBuild:
    substitute:
      APP_VERSION: "develop-1770176789" # {"$imagepolicy": "develop:payment-orchestrator:tag"}
