apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-expenses
spec:
  template:
    spec:
      containers:
      - name: expenses-container
        env:
        - name: DYNAMODB_EXPENSES_TABLE
          value: expenses-table
        - name: AWS_REGION
          value: us-west-2
        - name: OTEL_COLLECTOR
          value: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local
        - name: SERVICE_NAME
          value: expenses
        - name: SQS_QUEUE_NAME
          value: https://sqs.us-west-2.amazonaws.com/658299583140/expenses-service-queue
          