apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-payment
spec:
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: ambient
    spec:
      containers:
      - name: payment-container
        env:
        - name: DYNAMODB_PAYMENT_TABLE
          value: payment-table
        - name: AWS_REGION
          value: us-west-2
        - name: OTEL_COLLECTOR
          value: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local
        - name: SERVICE_NAME
          value: payment
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret