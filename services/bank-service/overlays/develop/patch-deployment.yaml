apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-bank
spec:
  template:
    spec:
      containers:
      - name: bank-container
        env:
        - name: DYNAMODB_BANK_TABLE
          value: bank-table
        - name: AWS_REGION
          value: us-west-2
        - name: OTEL_COLLECTOR
          value: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local
        - name: SERVICE_NAME
          value: bank
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret