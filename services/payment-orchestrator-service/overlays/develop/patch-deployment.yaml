apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-payment-orchestrator
spec:
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: ambient
    spec:
      containers:
      - name: payment-orchestrator-container
        env:
        - name: DYNAMODB_PAYMENT_TABLE
          value: payment-table
        - name: SQS_QUEUE_URL
          value: https://sqs.us-west-2.amazonaws.com/658299583140/payment-service-queue
        - name: AWS_REGION
          value: us-west-2
        - name: OTEL_COLLECTOR
          value: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local
        - name: SERVICE_NAME
          value: payment-orchestrator
        - name: EXPENSES_SERVICE_URL
          value: http://expenses.develop.svc.cluster.local:8282
        - name: BANK_SERVICE_URL
          value: http://bank.develop.svc.cluster.local:8585
        - name: PAYMENT_SERVICE_URL
          value: http://payment.develop.svc.cluster.local:8989